<svg width="1600" height="345" viewBox="0 0 1600 345" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Referanstaki koyu mor -> parlak mor -> koyu mor geçiş -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3b0a48"/>
      <stop offset="38%"  stop-color="#7d1498"/>
      <stop offset="52%"  stop-color="#a126bd"/>
      <stop offset="72%"  stop-color="#681180"/>
      <stop offset="100%" stop-color="#26052f"/>
    </linearGradient>

    <!-- Ortadaki parlaklık -->
    <radialGradient id="glow" cx="50%" cy="42%" r="43%">
      <stop offset="0%"   stop-color="#f18cff" stop-opacity="0.70"/>
      <stop offset="38%"  stop-color="#d85bea" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#d85bea" stop-opacity="0"/>
    </radialGradient>

    <!-- Üstten hafif kararma -->
    <linearGradient id="topShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16051d" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#16051d" stop-opacity="0"/>
      <stop offset="100%" stop-color="#16051d" stop-opacity="0.08"/>
    </linearGradient>

    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5"
                    flood-color="#000000" flood-opacity="0.40"/>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

  </defs>

  <!-- ANA ALAN -->
  <rect x="10" y="10"
        width="1580"
        height="325"
        rx="25"
        fill="url(#bg)"/>

  <!-- MERKEZ IŞIK -->
  <ellipse cx="800" cy="145"
           rx="420"
           ry="165"
           fill="url(#glow)"
           filter="url(#softGlow)"/>

  <!-- ÜST KARARTMA -->
  <rect x="10" y="10"
        width="1580"
        height="325"
        rx="25"
        fill="url(#topShade)"/>

  <!-- REFERANSTAKİ İNCE YATAY ÇİZGİLER -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.075">
    <line x1="10" y1="58"  x2="1590" y2="58"/>
    <line x1="10" y1="105" x2="1590" y2="105"/>
    <line x1="10" y1="152" x2="1590" y2="152"/>
    <line x1="10" y1="199" x2="1590" y2="199"/>
    <line x1="10" y1="246" x2="1590" y2="246"/>
    <line x1="10" y1="293" x2="1590" y2="293"/>
  </g>

  <!-- SOL URL -->
  <circle cx="70" cy="166" r="5.5" fill="#ffffff"/>

  <text x="92"
        y="171"
        fill="#ffffff"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        font-weight="700">
    discord.gg/biz
  </text>

  <!-- SAĞ URL -->
  <text x="1508"
        y="171"
        text-anchor="end"
        fill="#ffffff"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16"
        font-weight="700">
    discord.com/channels/@me
  </text>

  <circle cx="1531" cy="166" r="5.5" fill="#ffffff"/>

  <!-- ANA BAŞLIK -->
  <text x="800"
        y="165"
        text-anchor="middle"
        fill="#ffffff"
        font-family="Arial, Helvetica, sans-serif"
        font-size="74"
        font-weight="900"
        letter-spacing="13"
        filter="url(#textGlow)">
    RICHARD
  </text>

  <!-- ALT BAŞLIK -->
  <text x="800"
        y="202"
        text-anchor="middle"
        fill="#efd9f4"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11"
        font-weight="700"
        letter-spacing="5">
    WELCOME TO MY PROFILE
  </text>

  <!-- SOL ALT DEKOR -->
  <g stroke="#e3a0f0" stroke-width="2.5" opacity="0.62">
    <line x1="62"  y1="277" x2="116" y2="223"/>
    <line x1="83"  y1="284" x2="137" y2="230"/>
    <line x1="104" y1="291" x2="158" y2="237"/>
  </g>

  <!-- SAĞ ALT DEKOR -->
  <g stroke="#e3a0f0" stroke-width="2.5" opacity="0.62">
    <line x1="1442" y1="291" x2="1496" y2="237"/>
    <line x1="1463" y1="284" x2="1517" y2="230"/>
    <line x1="1484" y1="277" x2="1538" y2="223"/>
  </g>

  <!-- ALT ORTA ÇİZGİ -->
  <line x1="390"
        y1="267"
        x2="1210"
        y2="267"
        stroke="#efc3f7"
        stroke-width="1"
        opacity="0.24"/>

</svg>
