<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b0635"/>
      <stop offset="45%" stop-color="#7b148f"/>
      <stop offset="100%" stop-color="#2a0636"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#ff8cff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ff8cff" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8"
                    flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>

  <!-- GLOW -->
  <ellipse cx="600" cy="100" rx="280" ry="130"
           fill="url(#glow)"
           filter="url(#blur)"/>

  <!-- SUBTLE GRID -->
  <g opacity="0.08" stroke="#ffffff">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- LEFT DISCORD -->
  <g filter="url(#shadow)">
    <circle cx="48" cy="126" r="5" fill="#ffffff"/>
    <text x="68" y="132"
          fill="#ffffff"
          font-family="Arial, Helvetica, sans-serif"
          font-size="15"
          font-weight="600">
      discord.gg/biz
    </text>
  </g>

  <!-- CENTER -->
  <text x="600" y="125"
        text-anchor="middle"
        fill="#ffffff"
        font-family="Arial, Helvetica, sans-serif"
        font-size="64"
        font-weight="900"
        letter-spacing="11"
        filter="url(#shadow)">
    RICHARD
  </text>

  <text x="600" y="158"
        text-anchor="middle"
        fill="#e9c8ef"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12"
        font-weight="600"
        letter-spacing="4">
    WELCOME TO MY PROFILE
  </text>

  <!-- RIGHT DISCORD -->
  <g filter="url(#shadow)">
    <text x="1132" y="132"
          text-anchor="end"
          fill="#ffffff"
          font-family="Arial, Helvetica, sans-serif"
          font-size="14">
      discord.com/channels/@me
    </text>
    <circle cx="1152" cy="126" r="5" fill="#ffffff"/>
  </g>

  <!-- LEFT DECORATION -->
  <g stroke="#dc8aed" stroke-width="2" opacity="0.55">
    <line x1="48" y1="205" x2="98" y2="155"/>
    <line x1="68" y1="210" x2="118" y2="160"/>
    <line x1="88" y1="215" x2="138" y2="165"/>
  </g>

  <!-- RIGHT DECORATION -->
  <g stroke="#dc8aed" stroke-width="2" opacity="0.55">
    <line x1="1062" y1="215" x2="1112" y2="165"/>
    <line x1="1082" y1="210" x2="1132" y2="160"/>
    <line x1="1102" y1="205" x2="1152" y2="155"/>
  </g>

  <!-- BOTTOM LINE -->
  <line x1="260" y1="205" x2="940" y2="205"
        stroke="#e8b6ef" stroke-width="1" opacity="0.25"/>

</svg>
